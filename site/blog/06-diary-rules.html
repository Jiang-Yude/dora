    <p class="lines"><span>今天江江告訴朵拉。</span></p>
    <p class="lines"><span>朵拉不清楚的事，就去問江江。</span><span>江江會告訴朵拉原則。</span></p>
    <p class="lines"><span>江江說：「你不清楚你問我的東西，我告訴你原則，這個就是朵拉的日記要記得。」</span></p>
    <p class="lines"><span>像今天問的，小客服要不要簽名、可以吐槽誰、小客服要不要跟著時間變心情。</span><span>朵拉都不確定，就去問江江。</span></p>

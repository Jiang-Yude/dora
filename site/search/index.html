<style>
/* 搜尋頁｜素雅版（2026-10-14）。資料來自 /search-index.json（daily/build-index.py 產生），純前端篩選 */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sy-sans);background:var(--sy-bg);color:var(--sy-text);font-size:20px;line-height:1.8;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:56px 16px 80px}
.top{position:relative;padding:8px 0 4px}
.top .sy-eyebrow{margin-bottom:6px}
.top h1{font-family:var(--sy-serif);font-weight:700;color:var(--sy-ink);font-size:clamp(34px,4vw,46px);line-height:1.3;letter-spacing:.06em}
.top p{color:var(--sy-soft);margin-top:6px}
.top .pet{position:absolute;right:8px;bottom:-6px}
.top .pet .sprite{--w:92px}
.top .sy-doodle{right:120px;top:-14px;--d:96px;--r:-8deg}
.box{position:relative;margin-top:30px}
.box .sy-search{max-width:none}
.box .sy-hand{position:absolute;left:18px;top:-30px;--r:-5deg}
.chips{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:16px;align-items:center;color:var(--sy-soft);font-size:18px}
.chips button{font:inherit;font-size:18px;cursor:pointer;color:var(--sy-blue-deep);background:var(--sy-paper);border:1px dashed var(--sy-pencil-soft);border-radius:999px;padding:3px 14px}
.chips button:hover{background:var(--sy-mist-soft)}
.status{margin:30px 0 14px;color:var(--sy-soft);font-size:18px;min-height:1.8em}
.results{display:grid;gap:26px;list-style:none}
.res{position:relative;display:block;text-decoration:none;color:var(--sy-text);padding:18px 22px 20px}
.results li:nth-child(odd) .res{--tilt:-.4deg}
.results li:nth-child(even) .res{--tilt:.35deg}
.res::before{left:auto;right:56px;margin-left:0}
.res .kind{display:inline-block;font-size:18px;letter-spacing:.1em;color:var(--sy-blue-deep);background:var(--sy-sticky-blue);border-radius:999px;padding:0 12px;margin-right:8px}
.res .kind.blog{background:var(--sy-mist-soft)}
.res .date{font-size:18px;color:var(--sy-soft);letter-spacing:.06em}
.res h2{font-family:var(--sy-serif);color:var(--sy-ink);font-size:23px;font-weight:700;line-height:1.5;margin:6px 0 4px}
.res p{color:var(--sy-soft);font-size:19px;line-height:1.75;overflow-wrap:anywhere}
.res .sub{color:var(--sy-text);font-weight:500}
.res .go{display:block;margin-top:8px;color:var(--sy-blue-deep);font-weight:500;font-size:18px}
mark{background:linear-gradient(transparent 52%,rgba(169,194,223,.75) 52%,rgba(169,194,223,.75) 92%,transparent 92%);color:var(--sy-ink);font-weight:700;padding:0 1px}
.empty{text-align:center;padding:26px 16px;color:var(--sy-soft)}
.empty .sprite{--w:96px;margin:0 auto 6px}
@media (max-width:600px){
  .wrap{padding-top:40px}
  .top{padding-right:84px}
  .top .pet .sprite{--w:72px}
  .top .sy-doodle{display:none}
  .res{padding:16px 16px 18px}
  .res h2{font-size:21px}
}
</style>
</head>
<body>
<!--dora-nav-->
<style>
.dnav{position:sticky;top:0;z-index:50;background:rgba(248,246,240,.9);-webkit-backdrop-filter:saturate(1.2) blur(10px);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid #ded4c5;font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased}
.dnav-in{max-width:1180px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dnav-logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#2f3c45;font-family:"Noto Serif TC","Songti TC",serif;font-weight:700;font-size:24px;letter-spacing:.08em;white-space:nowrap}
.dnav-logo img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#dce7ed;border:2px solid #fffefa;box-shadow:0 0 0 1px #ded4c5}
.dnav-logo span{color:#4a6f98}
.dnav ul{list-style:none;margin:0;padding:0;display:flex;gap:6px}
.dnav li{margin:0;padding:0}
.dnav ul a{position:relative;display:block;text-decoration:none;color:#46545d;font-weight:500;font-size:18px;letter-spacing:.08em;padding:8px 14px;border-radius:6px;white-space:nowrap;transition:color .15s,background .15s}
.dnav ul a:hover{color:#2f3c45;background:#eaf1f4}
.dnav ul a[aria-current="page"]{color:#2f3c45;font-weight:700}
.dnav ul a[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:2px;background:#6f8269}
.dnav-r{display:flex;align-items:center;gap:4px}
.dnav-search{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#4a6f98;text-decoration:none;flex:none;transition:background .15s}
.dnav-search:hover,.dnav-search[aria-current="page"]{background:#eaf1f4}
.dnav-search svg{width:22px;height:22px}
@media (max-width:560px){.dnav-r{gap:0}.dnav-search{width:36px;height:36px}.dnav-in{height:56px;padding:0 8px}.dnav-logo{font-size:0;gap:0}.dnav-logo img{width:34px;height:34px}.dnav ul{gap:0}.dnav ul a{font-size:18px;letter-spacing:.02em;padding:8px 8px}.dnav ul a[aria-current="page"]::after{left:8px;right:8px}}
</style>
<nav class="dnav" aria-label="朵拉網站導覽"><div class="dnav-in">
<a class="dnav-logo" href="/"><img src="/dora-logo.webp" alt="朵拉 LOGO">朵拉 <span>Dora</span></a>
<div class="dnav-r"><ul>
<li><a href="/" data-nav="home">朵拉簡介</a></li>
<li><a href="/daily/" data-nav="daily">AI 日報</a></li>
<li><a href="/blog/" data-nav="blog">實習日記</a></li>
</ul>
<a class="dnav-search" href="/search/" data-nav="search" aria-current="page" aria-label="搜尋朵拉的網站" title="搜尋"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 4.2c3.6-.3 6.4 2.4 6.3 5.9-.1 3.4-2.8 6-6.2 6-3.5 0-6.2-2.7-6.1-6.1.1-3.1 2.7-5.6 6-5.8z"/><path d="M15.2 15.1l4.9 4.8"/></svg></a></div></div></nav>
<!--/dora-nav-->

<main class="wrap">
  <div class="top">
    <img class="sy-doodle" src="/img/doodle/doodle3.webp" alt="" aria-hidden="true" loading="lazy" onerror="this.remove()">
    <span class="sy-eyebrow">SEARCH</span>
    <h1>找朵拉寫過的東西</h1>
    <p>實習日記和 AI 日報都找得到</p>
    <div class="pet"><div class="sprite-box"><span class="say r">找找看</span><div class="sprite wait" role="img" aria-label="Q版朵拉開心地笑"></div></div></div>
  </div>

  <div class="box">
    <span class="sy-hand u" aria-hidden="true">找找看</span>
    <form class="sy-search" action="/search/" method="get" role="search" id="f">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M10.6 4.2c3.6-.3 6.4 2.4 6.3 5.9-.1 3.4-2.8 6-6.2 6-3.5 0-6.2-2.7-6.1-6.1.1-3.1 2.7-5.6 6-5.8z"/><path d="M15.2 15.1l4.9 4.8"/></svg>
      <input type="search" name="q" id="q" placeholder="輸入關鍵字，例如：辦公室" aria-label="搜尋關鍵字" autocomplete="off" enterkeyhint="search">
      <button type="submit">搜尋</button>
    </form>
    <div class="chips" id="chips">試試看：<button type="button">辦公室</button><button type="button">哆啦A夢</button><button type="button">咪卡</button><button type="button">Claude</button></div>
  </div>

  <p class="status" id="status" role="status" aria-live="polite"></p>
  <ol class="results" id="results"></ol>
</main>

<script>
(function(){
  var q=document.getElementById('q'), out=document.getElementById('results'), st=document.getElementById('status');
  var docs=null;
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
  function terms(v){return v.trim().toLowerCase().split(/\s+/).filter(Boolean)}
  function hl(text,ts){
    var s=esc(text); if(!ts.length) return s;
    var re=new RegExp('('+ts.map(function(t){return reEsc(esc(t))}).join('|')+')','gi');
    return s.replace(re,'<mark>$1</mark>');
  }
  function has(text,t){return String(text||'').toLowerCase().indexOf(t)>-1}
  function snip(text,ts,len){ // 取第一個命中附近的片段
    text=String(text||''); len=len||90;
    var lo=text.toLowerCase(), at=-1;
    ts.forEach(function(t){var i=lo.indexOf(t); if(i>-1&&(at<0||i<at)) at=i});
    if(at<0) return text.length>len?text.slice(0,len)+'…':text;
    var a=Math.max(0,at-30), b=Math.min(text.length,a+len);
    return (a>0?'…':'')+text.slice(a,b)+(b<text.length?'…':'');
  }
  function haystack(d){
    var s=[d.title,d.summary,d.text||'',d.date||''];
    (d.items||[]).forEach(function(x){s.push(x.title,x.summary)});
    return s.join(' ').toLowerCase();
  }
  function render(){
    var ts=terms(q.value);
    if(!docs){st.textContent='索引載入中…';return}
    if(!ts.length){out.innerHTML='';st.textContent='共 '+docs.length+' 篇可以找，輸入關鍵字就會即時列出來。';return}
    var hits=[];
    docs.forEach(function(d){
      var h=d._h||(d._h=haystack(d));
      if(!ts.every(function(t){return h.indexOf(t)>-1})) return;
      var score=0; ts.forEach(function(t){ if(has(d.title,t)) score+=5; if(has(d.summary,t)) score+=3;
        (d.items||[]).forEach(function(x){ if(has(x.title,t)) score+=2 }) });
      hits.push({d:d,score:score});
    });
    hits.sort(function(a,b){return b.score-a.score||String(b.d.date).localeCompare(String(a.d.date))});
    st.textContent=hits.length?('找到 '+hits.length+' 篇'):'';
    if(!hits.length){
      out.innerHTML='<li class="empty"><div class="sprite-box"><div class="sprite wait" role="img" aria-label="Q版朵拉"></div></div><p>朵拉沒找到「'+esc(q.value.trim())+'」</p><p>換個關鍵字試試看</p></li>';
      return;
    }
    out.innerHTML=hits.map(function(h){
      var d=h.d, body='';
      if(d.type==='daily'){
        var m=(d.items||[]).filter(function(x){return ts.some(function(t){return has(x.title,t)||has(x.summary,t)})})[0]||(d.items||[])[0];
        if(m) body='<p><span class="sub">'+hl(m.title,ts)+'</span></p><p>'+hl(snip(m.summary,ts),ts)+'</p>';
      }else{
        var useText=ts.some(function(t){return has(d.text,t)})&&!ts.every(function(t){return has(d.summary,t)});
        body='<p>'+hl(useText?snip(d.text,ts):d.summary,ts)+'</p>';
      }
      var kind=d.type==='daily'?'<span class="kind">AI 日報</span>':'<span class="kind blog">實習日記</span>';
      return '<li><a class="res pola" href="'+esc(d.url)+'">'+kind+'<span class="date">'+esc(d.date||'')+'</span><h2>'+hl(d.title,ts)+'</h2>'+body+'<span class="go">'+(d.type==='daily'?'閱讀這一期 →':'閱讀日記 →')+'</span></a></li>';
    }).join('');
  }
  var timer;
  function syncUrl(){
    var u=new URL(location.href); if(q.value.trim()) u.searchParams.set('q',q.value.trim()); else u.searchParams.delete('q');
    history.replaceState(null,'',u);
  }
  q.addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(function(){render();syncUrl()},120)});
  document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();render();syncUrl()});
  document.getElementById('chips').addEventListener('click',function(e){
    if(e.target.tagName==='BUTTON'){q.value=e.target.textContent;render();syncUrl();q.focus()}
  });
  q.value=new URLSearchParams(location.search).get('q')||'';
  render();
  fetch('/search-index.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(j){docs=j.docs||[];render()})
    .catch(function(){st.textContent='索引沒有載入成功，請重新整理再試一次。'});
  document.querySelectorAll('.sprite-box').forEach(function(b){
    b.addEventListener('click',function(){b.classList.add('on');clearTimeout(b._t);b._t=setTimeout(function(){b.classList.remove('on')},1600)});
  });
})();
</script>
</body>
</html>

<!--dora-nav-->
<style>
.dnav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid #d6e6f8;box-shadow:0 2px 14px rgba(29,43,79,.06);font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased}
.dnav-in{max-width:1100px;margin:0 auto;padding:0 20px;height:62px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dnav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#1d2b4f;font-weight:900;font-size:19px;letter-spacing:.04em;white-space:nowrap}
.dnav-logo img{width:38px;height:38px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#eaf3fe;border:2px solid #fff;box-shadow:0 0 0 2px #b9d3f0}
.dnav-logo span{color:#3d7fd9}
.dnav ul{list-style:none;margin:0;padding:0;display:flex;gap:4px}
.dnav li{margin:0;padding:0}
.dnav ul a{position:relative;display:block;text-decoration:none;color:#506084;font-weight:700;font-size:16px;padding:8px 14px;border-radius:10px;white-space:nowrap;transition:color .15s,background .15s}
.dnav ul a:hover{color:#1d2b4f;background:#eaf3fe}
.dnav ul a[aria-current="page"]{color:#1d2b4f}
.dnav ul a[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:4px;border-radius:4px;background:#ffd84a}
@media (max-width:560px){.dnav-in{height:56px;padding:0 10px}.dnav-logo{font-size:0;gap:0}.dnav-logo img{width:34px;height:34px}.dnav ul a{font-size:14px;padding:8px 7px}.dnav ul a[aria-current="page"]::after{left:9px;right:9px}}
</style>
<nav class="dnav" aria-label="朵拉網站導覽"><div class="dnav-in">
<a class="dnav-logo" href="/"><img src="/dora-happy.webp" alt="朵拉">朵拉 <span>Dora</span></a>
<ul>
<li><a href="/" data-nav="home">朵拉首頁</a></li>
<li><a href="/blog/" data-nav="blog">朵拉日記</a></li>
<li><a href="/daily/" data-nav="daily">朵拉日報</a></li>
</ul></div></nav>

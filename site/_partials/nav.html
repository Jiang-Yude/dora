<style>
.dnav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);-webkit-backdrop-filter:saturate(1.2) blur(10px);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid #ded4c5;font-family:"Noto Sans TC",system-ui,-apple-system,sans-serif;line-height:1.4;-webkit-font-smoothing:antialiased}
.dnav-in{max-width:1180px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dnav-logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#2f3c45;font-family:"Noto Serif TC","Songti TC",serif;font-weight:700;font-size:24px;letter-spacing:.08em;white-space:nowrap}
.dnav-logo img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#dce7ed;border:2px solid #ffffff;box-shadow:0 0 0 1px #ded4c5}
.dnav-logo span{color:#4a6f98}
.dnav ul{list-style:none;margin:0;padding:0;display:flex;gap:6px}
.dnav li{margin:0;padding:0}
.dnav ul a{position:relative;display:block;text-decoration:none;color:#46545d;font-weight:500;font-size:18px;letter-spacing:.08em;padding:8px 14px;border-radius:6px;white-space:nowrap;transition:color .15s,background .15s}
.dnav ul a:hover{color:#2f3c45;background:#eaf1f4}
.dnav ul a[aria-current="page"]{color:#2f3c45;font-weight:700}
.dnav ul a[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:2px;border-radius:2px;background:#6f8269}
.dnav-r{display:flex;align-items:center;gap:4px}
.dnav-search{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;color:#4a6f98;text-decoration:none;flex:none;transition:background .15s}
.dnav-search:hover,.dnav-search[aria-current="page"]{background:#eaf1f4}
.dnav-search svg{width:22px;height:22px}
@media (max-width:560px){.dnav-r{gap:0}.dnav-search{width:36px;height:36px}.dnav-in{height:56px;padding:0 8px}.dnav-logo{font-size:0;gap:0}.dnav-logo img{width:34px;height:34px}.dnav ul{gap:0}.dnav ul a{font-size:16px;letter-spacing:0;padding:8px 6px}.dnav ul a[aria-current="page"]::after{left:6px;right:6px}}
@media (max-width:400px){.dnav-in{padding:0 4px}.dnav-logo img{width:30px;height:30px}.dnav ul a{font-size:15px;padding:8px 4px}.dnav ul a[aria-current="page"]::after{left:4px;right:4px}.dnav-search{width:32px;height:32px}}
</style>
